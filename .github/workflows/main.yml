name: Premarket Stock Report

# ── 排程設計 ────────────────────────────────────────────────────────────────
# GitHub cron 只支援 UTC，而且尖峰時段常延遲 30~60 分鐘、偶爾漏跑。
# 因此每個市場在推播前約 4 小時內排多個觸發：
#   1. 最先抵達的觸發：休眠到推播前 25 分鐘 → 抓最新數據 + Claude 分析 → 準點推播 → 在 bot-state 分支記錄今日已推播
#   2. 之後抵達的觸發：同市場排隊等待（concurrency），輪到時看到「今日已推播」立即結束
#   3. 若全部觸發都延遲到推播時間之後：仍補送並標示「開盤後送達」（3 小時內）
# 程式用 America/New_York / Asia/Taipei 計算真正的推播時間，冬夏令自動處理。
on:
  schedule:
    # 美股：推播 = 紐約 09:20（夏令 EDT = UTC 13:20；冬令 EST = UTC 14:20）
    - cron: "47 9 * * 1-5"
    - cron: "27 10 * * 1-5"
    - cron: "7 11 * * 1-5"
    - cron: "47 11 * * 1-5"
    - cron: "27 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "47 13 * * 1-5"
    # 台股：推播 = 台北 08:50 = UTC 00:50（前一個 UTC 日的晚上，週日~週四 = 台北週一~週五）
    - cron: "37 21 * * 0-4"
    - cron: "17 22 * * 0-4"
    - cron: "57 22 * * 0-4"
    - cron: "37 23 * * 0-4"
    - cron: "12 0 * * 1-5"
    - cron: "32 0 * * 1-5"
  # 測試開關：修改 repo 根目錄 .run-test 並推送 → 執行一次。內容第一個字 us/tw；含 noforce 則走正式排程邏輯
  push:
    branches: [main]
    paths: [".run-test"]
  workflow_dispatch:
    inputs:
      market:
        description: "市場"
        type: choice
        options: [us, tw]
        default: us
      force:
        description: "立即執行（略過時間窗、休市與今日已推播檢查）"
        type: boolean
        default: true
      dry_run:
        description: "只印在 log，不發 Telegram"
        type: boolean
        default: false

permissions:
  contents: write   # 寫入 bot-state（今日已推播紀錄）與 test-results 分支

# 程式碼放在 repo 的 stock-premarket-bot/ 子資料夾，所有指令都在該資料夾內執行
defaults:
  run:
    working-directory: stock-premarket-bot

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 最早的觸發可能需休眠約 3.5 小時（公開 repo 的 Actions 分鐘數不計費）
    concurrency:
      # 同市場的觸發排隊執行，避免重複推播
      group: premarket-${{ github.event_name == 'push' && 'test' || (contains(fromJSON('["37 21 * * 0-4","17 22 * * 0-4","57 22 * * 0-4","37 23 * * 0-4","12 0 * * 1-5","32 0 * * 1-5"]'), github.event.schedule) && 'tw' || (inputs.market || 'us')) }}
      cancel-in-progress: false
    env:
      MARKET: ${{ github.event_name == 'workflow_dispatch' && inputs.market || (contains(fromJSON('["37 21 * * 0-4","17 22 * * 0-4","57 22 * * 0-4","37 23 * * 0-4","12 0 * * 1-5","32 0 * * 1-5"]'), github.event.schedule) && 'tw' || 'us') }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      STATE_DIR: /tmp/bot-state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stock-premarket-bot/requirements.txt

      - name: 測試模式：從 .run-test 讀取市場與是否強制
        if: github.event_name == 'push'
        run: |
          read -r M REST < ../.run-test || true
          case "$M" in tw|us) ;; *) M=us ;; esac
          F=true; case "$REST" in *noforce*) F=false ;; esac
          echo "MARKET=$M" >> "$GITHUB_ENV"
          echo "FORCE=$F" >> "$GITHUB_ENV"
          echo "測試模式：market=$M force=$F"

      - name: 讀取推播紀錄（bot-state 分支）
        run: |
          mkdir -p "$STATE_DIR"
          if git fetch -q --depth 1 origin bot-state 2>/dev/null; then
            # 注意：git archive 在子資料夾執行只會打包該子資料夾，必須在 repo 根目錄執行
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD | tar -x -C "$STATE_DIR"
            if ! ls "$STATE_DIR"/last_sent_*.txt >/dev/null 2>&1; then
              echo "::error::bot-state 分支存在但讀不到推播紀錄，為避免重複推播而中止"; exit 1
            fi
          fi
          ls -la "$STATE_DIR"; cat "$STATE_DIR"/last_sent_*.txt 2>/dev/null || echo "（尚無推播紀錄）"

      - name: 時間窗 / 今日是否已推播 檢查（自動處理冬夏令）
        id: gate
        run: |
          echo "trigger=${{ github.event_name }} schedule='${{ github.event.schedule }}' market=$MARKET force=$FORCE"
          python gate.py "$MARKET" "$FORCE" "$STATE_DIR" | tee gate.log

      - name: 安裝套件
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 執行分析並推播
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_FALLBACK_MODEL: ${{ vars.ANTHROPIC_FALLBACK_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS="--market $MARKET"
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          set -o pipefail
          python main.py $ARGS 2>&1 | tee run.log

      - name: 記錄今日已推播（bot-state 分支）
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          if [ ! -f "reports/sent_${MARKET}.txt" ]; then echo "本次未推播（休市或測試模式），不記錄"; exit 0; fi
          cp "reports/sent_${MARKET}.txt" "$STATE_DIR/last_sent_${MARKET}.txt"
          cd "$STATE_DIR"
          echo "最後更新：$(date -u +%FT%TZ) run=${{ github.run_id }}" > README.md
          git init -q && git checkout -q -b bot-state
          git add -A && git -c user.name=premarket-bot -c user.email=bot@users.noreply.github.com commit -qm "sent ${MARKET} $(cat last_sent_${MARKET}.txt)"
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bot-state && break
            sleep 5
          done
          echo "已記錄：${MARKET} $(cat last_sent_${MARKET}.txt)"

      - name: 測試模式：把 log 與報告推到 test-results 分支
        if: github.event_name == 'push' && always()
        run: |
          mkdir -p /tmp/out && cp -r reports /tmp/out/ 2>/dev/null || true
          cp run.log /tmp/out/ 2>/dev/null || echo "no run.log（時間窗、休市或今日已推播檢查已略過）" > /tmp/out/run.log
          cp gate.log /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/state && cp "$STATE_DIR"/*.txt /tmp/out/state/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b test-results
          echo "run=${{ github.run_id }} market=$MARKET force=$FORCE sha=${{ github.sha }}" > meta.txt
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "test run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-results

      - name: 執行紀錄（run-logs 分支，供除錯）
        if: github.event_name != 'workflow_dispatch' && always()
        run: |
          D=$(TZ=Asia/Taipei date +%F)
          NAME="logs/${D}_${MARKET}_$(date -u +%H%M)utc_${{ github.run_id }}.log"
          { echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}' 實際啟動 UTC $(date -u +%FT%TZ)"; cat gate.log 2>/dev/null;
            grep -E " (INFO|WARNING|ERROR) " run.log 2>/dev/null | tail -60; } > /tmp/this.log
          rm -rf /tmp/logs && mkdir -p /tmp/logs && cd /tmp/logs && git init -q
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in 1 2 3; do
            if git fetch -q --depth 50 "$R" run-logs 2>/dev/null; then git checkout -q -B run-logs FETCH_HEAD; else git checkout -q --orphan run-logs; fi
            mkdir -p logs && cp /tmp/this.log "$NAME"
            git add -A && git -c user.name=premarket-bot -c user.email=bot@users.noreply.github.com commit -qm "log $NAME"
            git push -q "$R" run-logs && break
            sleep $((RANDOM % 10 + 3))
          done

      - name: 保存報告
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ env.MARKET }}-${{ github.run_id }}
          path: stock-premarket-bot/reports/
          retention-days: 30
          if-no-files-found: ignore
