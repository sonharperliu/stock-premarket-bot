name: Premarket Stock Report

# GitHub cron 只支援 UTC。美股排兩個時間（分別對應夏令 EDT / 冬令 EST），
# 程式會用 America/New_York 判斷哪一個才是「開盤前 10 分鐘」，另一個自動略過。
# 提早約 30 分鐘啟動：預留資料抓取 + Claude 分析時間，並緩衝 GitHub 排程延遲，程式會等到準點才推播。
on:
  schedule:
    - cron: "50 12 * * 1-5"   # 美股（夏令 EDT）= 紐約 08:50 啟動 → 09:20 推播
    - cron: "50 13 * * 1-5"   # 美股（冬令 EST）= 紐約 08:50 啟動 → 09:20 推播
    - cron: "15 0 * * 1-5"    # 台股 = 台北 08:15 啟動 → 08:50 推播
  # 測試開關：修改 repo 根目錄的 .run-test 並推送 → 立即強制執行一次（commit 訊息含 [tw] 則測台股）
  push:
    branches: [main]
    paths: [".run-test"]   # .run-test 內容第一個字為 us/tw；含 noforce 則走正式排程的時間窗/休市檢查
  workflow_dispatch:
    inputs:
      market:
        description: "市場"
        type: choice
        options: [us, tw]
        default: us
      force:
        description: "立即執行（略過時間窗與休市檢查）"
        type: boolean
        default: true
      dry_run:
        description: "只印在 log，不發 Telegram"
        type: boolean
        default: false

permissions:
  contents: write   # 僅測試模式用來把 log 推到 test-results 分支

# 程式碼放在 repo 的 stock-premarket-bot/ 子資料夾，所有指令都在該資料夾內執行
defaults:
  run:
    working-directory: stock-premarket-bot

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: premarket-${{ github.event.schedule == '15 0 * * 1-5' && 'tw' || inputs.market || 'us' }}
      cancel-in-progress: false
    env:
      MARKET: ${{ github.event_name == 'workflow_dispatch' && inputs.market || (github.event.schedule == '15 0 * * 1-5' && 'tw' || 'us') }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stock-premarket-bot/requirements.txt

      - name: 測試模式：從 .run-test 讀取市場與是否強制
        if: github.event_name == 'push'
        run: |
          read -r M REST < ../.run-test || true
          case "$M" in tw|us) ;; *) M=us ;; esac
          F=true; case "$REST" in *noforce*) F=false ;; esac
          echo "MARKET=$M" >> "$GITHUB_ENV"
          echo "FORCE=$F" >> "$GITHUB_ENV"
          echo "測試模式：market=$M force=$F"

      - name: 時間窗檢查（自動處理冬夏令）
        id: gate
        run: python gate.py "$MARKET" "$FORCE" | tee gate.log

      - name: 安裝套件
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 執行分析並推播
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS="--market $MARKET"
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          set -o pipefail
          python main.py $ARGS 2>&1 | tee run.log

      - name: 測試模式：把 log 與報告推到 test-results 分支
        if: github.event_name == 'push' && always()
        run: |
          mkdir -p /tmp/out && cp -r reports /tmp/out/ 2>/dev/null || true
          cp run.log /tmp/out/ 2>/dev/null || echo "no run.log（時間窗或休市檢查已略過）" > /tmp/out/run.log
          cp gate.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b test-results
          echo "run=${{ github.run_id }} market=$MARKET sha=${{ github.sha }}" > meta.txt
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "test run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-results

      - name: 保存報告
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ env.MARKET }}-${{ github.run_id }}
          path: stock-premarket-bot/reports/
          retention-days: 30
          if-no-files-found: ignore
